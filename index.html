<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Magic Photo Frame - Lord Venkateswara</title>

<script>
/* OpenCV is loaded below. We deliberately use the script-load
   callback plus onRuntimeInitialized so the START button cannot
   become active before OpenCV is actually usable. */
window.Module = {
    onRuntimeInitialized: function () {
        window.openCVRuntimeReady = true;
        if (typeof window.finishOpenCV === "function") {
            window.finishOpenCV();
        }
    }
};
</script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;padding:0;width:100%;min-height:100%;
    background:#111;color:#fff;font-family:Arial,sans-serif;
    text-align:center;
}
h1{margin:12px 0 8px;font-size:23px}
#camera{
    width:100%;max-width:700px;height:auto;display:block;
    margin:0 auto;background:#000;
}
#canvas{display:none}
#status{
    margin:10px 12px;min-height:48px;font-size:15px;line-height:1.4;
}
#startButton{
    padding:14px 24px;font-size:18px;font-weight:bold;
    border:0;border-radius:9px;cursor:pointer;
}
#startButton:disabled{opacity:.5}
#videoContainer{
    display:none;position:fixed;inset:0;width:100%;height:100%;
    background:#000;z-index:100;align-items:center;justify-content:center;
}
#videoPlayer{width:100%;height:100%;object-fit:contain;background:#000}
#closeVideo{
    position:absolute;top:max(18px,env(safe-area-inset-top));right:18px;
    z-index:200;min-width:95px;height:55px;padding:0 18px;
    border:2px solid #fff;border-radius:12px;background:rgba(0,0,0,.8);
    color:#fff;font-size:20px;font-weight:bold;
}
#soundPanel{
    display:none;position:absolute;left:0;right:0;
    bottom:max(30px,env(safe-area-inset-bottom));z-index:201;
}
#playSoundButton{
    padding:14px 24px;font-size:18px;border:0;border-radius:9px;
    background:#fff;color:#000;font-weight:bold;
}
#debug{
    margin:4px 10px;color:#aaa;font-size:12px;word-break:break-word;
}
</style>
</head>

<body>
<h1>MAGIC PHOTO FRAME</h1>

<button id="startButton" disabled>LOADING OPENCV...</button>

<video id="camera" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="status">Loading OpenCV...</div>
<div id="debug"></div>

<div id="videoContainer">
    <button id="closeVideo" onclick="closeVideo()">✕ CLOSE</button>

    <video id="videoPlayer" controls playsinline preload="metadata"></video>

    <div id="soundPanel">
        <button id="playSoundButton" onclick="enableSound()">🔊 TAP FOR SOUND</button>
    </div>
</div>

<script>
"use strict";

/* =========================================================
   1. PROJECT
   ========================================================= */

const GITHUB_BASE =
    "https://vishwanathyerramsetty-oss.github.io/MagicPhotoFrame/";

const TOTAL_PHOTOS = 19;

const photoVideos = Array.from(
    {length: TOTAL_PHOTOS},
    (_, i) => {
        const n = String(i + 1).padStart(3, "0");
        return {
            id: "PHOTO_" + n,
            image: "photos/PHOTO_" + n + ".jpg",
            video: GITHUB_BASE + "PHOTO_" + n + ".mp4"
        };
    }
);

/* =========================================================
   2. ELEMENTS
   ========================================================= */

let camera, canvas, context, statusText, debugText;
let startButton, videoContainer, videoPlayer, soundPanel;

/* =========================================================
   3. STATE
   ========================================================= */

let referencePhotos = [];
let liveOrb = null;
let scannerRunning = false;
let videoPlaying = false;
let openCVReady = false;
let loadingReferences = false;

let lastScanTime = 0;
let lastDetectionTime = 0;
let candidateId = null;
let candidateCount = 0;

/* =========================================================
   4. RECOGNITION SETTINGS
   First make recognition work reliably.
   We use ORB to rank all 19, then RANSAC only on top 3.
   ========================================================= */

const ORB_FEATURES = 800;
const MATCH_RATIO = 0.78;

const MIN_GOOD_MATCHES = 7;
const MIN_RANSAC_INLIERS = 5;
const MIN_INLIER_RATIO = 0.18;
const MIN_RELATIVE_MARGIN = 0.08;

const REQUIRED_CONFIRMATIONS = 2;
const SCAN_INTERVAL = 350;
const DETECTION_COOLDOWN = 4000;

/* =========================================================
   5. BASIC UI
   ========================================================= */

function setStatus(message){
    statusText.innerText = message;
}

function setDebug(message){
    debugText.innerText = message || "";
}

/* =========================================================
   6. OPENCV INITIALIZATION
   ========================================================= */

function finishOpenCV(){

    if (openCVReady) return;

    if (
        typeof cv === "undefined" ||
        !cv.Mat ||
        !cv.ORB ||
        !cv.BFMatcher
    ){
        return;
    }

    openCVReady = true;

    setStatus("OpenCV ready. Press START SCANNER.");
    startButton.disabled = false;
    startButton.innerText = "START SCANNER";
}

function waitForOpenCV(){

    const timer = setInterval(function(){

        if (
            typeof cv !== "undefined" &&
            cv.Mat &&
            cv.ORB &&
            cv.BFMatcher
        ){
            clearInterval(timer);
            finishOpenCV();
        }

    }, 200);

    setTimeout(function(){

        if (!openCVReady){
            setStatus(
                "OpenCV did not finish loading. Refresh this page and try again."
            );
        }

    }, 20000);
}

/* =========================================================
   7. ORB CREATOR
   ========================================================= */

function createORB(){

    if (typeof cv.ORB_create === "function"){
        return cv.ORB_create(ORB_FEATURES);
    }

    return new cv.ORB(ORB_FEATURES);
}

/* =========================================================
   8. LOAD IMAGE
   ========================================================= */

function loadImage(url){

    return new Promise(function(resolve,reject){

        const img = new Image();

        img.onload = function(){
            resolve(img);
        };

        img.onerror = function(){
            reject(new Error("Image failed: " + url));
        };

        img.src = url + "?v=20261001";
    });
}

/* =========================================================
   9. REFERENCE PHOTO
   ========================================================= */

async function loadReferencePhoto(photo){

    const img = await loadImage(photo.image);

    const targetWidth = 480;
    const scale = targetWidth / img.naturalWidth;

    const refCanvas = document.createElement("canvas");

    refCanvas.width = targetWidth;
    refCanvas.height = Math.max(
        1,
        Math.round(img.naturalHeight * scale)
    );

    const ctx = refCanvas.getContext("2d", {willReadFrequently:true});

    ctx.drawImage(
        img,
        0, 0,
        refCanvas.width,
        refCanvas.height
    );

    const mat = cv.imread(refCanvas);
    const gray = new cv.Mat();

    cv.cvtColor(
        mat,
        gray,
        cv.COLOR_RGBA2GRAY
    );

    const orb = createORB();
    const keypoints = new cv.KeyPointVector();
    const descriptors = new cv.Mat();

    /* No aggressive mask: preserve the complete reference image. */
    orb.detectAndCompute(
        gray,
        new cv.Mat(),
        keypoints,
        descriptors
    );

    const count = keypoints.size();

    console.log(photo.id, "keypoints:", count);

    if (descriptors.empty() || count < 8){

        mat.delete();
        gray.delete();
        orb.delete();
        keypoints.delete();
        descriptors.delete();

        throw new Error(
            photo.id + " has too few ORB features."
        );
    }

    referencePhotos.push({
        id: photo.id,
        video: photo.video,
        keypoints: keypoints,
        descriptors: descriptors
    });

    mat.delete();
    gray.delete();
    orb.delete();
}

/* =========================================================
   10. LOAD ALL 19
   ========================================================= */

async function loadReferencePhotos(){

    if (loadingReferences) return;

    loadingReferences = true;
    referencePhotos = [];

    try{

        for (
            let i = 0;
            i < photoVideos.length;
            i++
        ){

            const photo = photoVideos[i];

            setStatus(
                "Loading " +
                photo.id +
                " (" +
                (i + 1) +
                "/19)..."
            );

            await loadReferencePhoto(photo);
        }

        setStatus(
            "All 19 photos loaded. Point camera at a photo."
        );

        setDebug(
            "Reference images ready: " +
            referencePhotos.length +
            "/19"
        );

    }
    catch(error){

        console.error("REFERENCE LOAD ERROR:", error);

        setStatus(
            "PHOTO LOAD ERROR: " +
            error.message
        );

        setDebug(
            "Check that photos/PHOTO_001.jpg through PHOTO_019.jpg exist."
        );

        throw error;

    }
    finally{

        loadingReferences = false;
    }
}

/* =========================================================
   11. START SCANNER
   ========================================================= */

async function startScanner(){

    if (scannerRunning || videoPlaying) return;

    if (!openCVReady){

        setStatus("OpenCV is not ready yet.");
        return;
    }

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        setStatus(
            "This browser cannot access the camera."
        );
        return;
    }

    try{

        startButton.disabled = true;

        setStatus("Requesting rear camera permission...");
        setDebug("");

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:{ideal:"environment"},
                    width:{ideal:1280},
                    height:{ideal:720}
                },
                audio:false
            });

        camera.srcObject = stream;

        await camera.play();

        setStatus("Camera started. Loading 19 reference photos...");

        if (referencePhotos.length === 0){
            await loadReferencePhotos();
        }

        if (!liveOrb){
            liveOrb = createORB();
        }

        scannerRunning = true;
        candidateId = null;
        candidateCount = 0;
        lastScanTime = 0;

        startButton.innerText = "SCANNING...";

        setStatus(
            "Scanning. Point the camera at one of PHOTO_001 to PHOTO_019."
        );

        requestAnimationFrame(scanFrame);

    }
    catch(error){

        console.error("START ERROR:", error);

        scannerRunning = false;
        startButton.disabled = false;
        startButton.innerText = "START SCANNER";

        if (error.name === "NotAllowedError"){

            setStatus(
                "Camera permission denied. Allow camera access in Chrome."
            );

        }
        else if (error.name === "NotFoundError"){

            setStatus("No camera found.");

        }
        else{

            setStatus(
                "START ERROR: " +
                error.message
            );
        }
    }
}

/* =========================================================
   12. MATCH ONE REFERENCE
   ========================================================= */

function getGoodMatches(
    reference,
    liveDescriptors
){

    if (
        !reference ||
        reference.descriptors.empty() ||
        liveDescriptors.empty()
    ){
        return [];
    }

    const matcher =
        new cv.BFMatcher(
            cv.NORM_HAMMING,
            false
        );

    const matches =
        new cv.DMatchVectorVector();

    matcher.knnMatch(
        liveDescriptors,
        reference.descriptors,
        matches,
        2
    );

    const good = [];

    for (
        let i = 0;
        i < matches.size();
        i++
    ){

        const pair = matches.get(i);

        if (pair.size() >= 2){

            const a = pair.get(0);
            const b = pair.get(1);

            if (
                a.distance <
                MATCH_RATIO * b.distance
            ){
                good.push(a);
            }
        }
    }

    matches.delete();
    matcher.delete();

    return good;
}

/* =========================================================
   13. RANSAC ON ONE CANDIDATE
   ========================================================= */

function calculateRansac(
    reference,
    liveKeypoints,
    goodMatches
){

    if (goodMatches.length < 4){
        return {
            inliers:0,
            ratio:0
        };
    }

    const src = [];
    const dst = [];

    for (const match of goodMatches){

        const lp =
            liveKeypoints
                .get(match.queryIdx)
                .pt;

        const rp =
            reference.keypoints
                .get(match.trainIdx)
                .pt;

        src.push(lp.x, lp.y);
        dst.push(rp.x, rp.y);
    }

    const srcMat =
        cv.matFromArray(
            goodMatches.length,
            2,
            cv.CV_32FC2,
            src
        );

    const dstMat =
        cv.matFromArray(
            goodMatches.length,
            2,
            cv.CV_32FC2,
            dst
        );

    const mask = new cv.Mat();
    let H = null;

    try{

        H =
            cv.findHomography(
                srcMat,
                dstMat,
                cv.RANSAC,
                8.0,
                mask
            );

    }
    catch(error){

        console.warn("RANSAC error:", error);
    }

    let inliers = 0;

    if (
        H &&
        !H.empty() &&
        !mask.empty()
    ){

        for (
            let i = 0;
            i < mask.rows;
            i++
        ){

            if (
                mask.ucharPtr(i,0)[0] !== 0
            ){
                inliers++;
            }
        }
    }

    const ratio =
        goodMatches.length
            ? inliers / goodMatches.length
            : 0;

    if (H) H.delete();
    mask.delete();
    srcMat.delete();
    dstMat.delete();

    return {
        inliers:inliers,
        ratio:ratio
    };
}

/* =========================================================
   14. SCAN FRAME
   ========================================================= */

function scanFrame(timestamp){

    if (
        !scannerRunning ||
        videoPlaying
    ){
        return;
    }

    if (
        timestamp - lastScanTime <
        SCAN_INTERVAL
    ){

        requestAnimationFrame(scanFrame);
        return;
    }

    lastScanTime = timestamp;

    try{

        const width = camera.videoWidth;
        const height = camera.videoHeight;

        if (!width || !height){

            requestAnimationFrame(scanFrame);
            return;
        }

        const scanWidth = 480;

        canvas.width = scanWidth;
        canvas.height =
            Math.round(
                height *
                scanWidth /
                width
            );

        context.drawImage(
            camera,
            0,0,
            canvas.width,
            canvas.height
        );

        const frame = cv.imread(canvas);
        const gray = new cv.Mat();

        cv.cvtColor(
            frame,
            gray,
            cv.COLOR_RGBA2GRAY
        );

        const keypoints =
            new cv.KeyPointVector();

        const descriptors =
            new cv.Mat();

        liveOrb.detectAndCompute(
            gray,
            new cv.Mat(),
            keypoints,
            descriptors
        );

        if (descriptors.empty()){

            setStatus(
                "Camera working. No ORB features yet. Move closer to photo."
            );

            frame.delete();
            gray.delete();
            keypoints.delete();
            descriptors.delete();

            requestAnimationFrame(scanFrame);
            return;
        }

        /*
           Stage 1:
           Compare ORB matches against all 19.
        */

        const ranked = [];

        for (
            const reference of referencePhotos
        ){

            const good =
                getGoodMatches(
                    reference,
                    descriptors
                );

            ranked.push({
                photo:reference,
                good:good
            });
        }

        ranked.sort(
            (a,b) =>
                b.good.length -
                a.good.length
        );

        /*
           Stage 2:
           RANSAC only on top 3.
           This is much lighter than doing homography
           calculations for all 19 every frame.
        */

        const top =
            ranked.slice(0,3);

        const results = [];

        for (const item of top){

            const geo =
                calculateRansac(
                    item.photo,
                    keypoints,
                    item.good
                );

            const score =
                geo.inliers * 2 +
                item.good.length * 0.5 +
                geo.ratio * 20;

            results.push({
                photo:item.photo,
                good:item.good.length,
                inliers:geo.inliers,
                ratio:geo.ratio,
                score:score
            });
        }

        results.sort(
            (a,b) =>
                b.score - a.score
        );

        const best =
            results.length
                ? results[0]
                : null;

        const second =
            results.length > 1
                ? results[1]
                : null;

        let margin = 1;

        if (
            best &&
            second &&
            best.score > 0
        ){

            margin =
                (best.score - second.score) /
                best.score;
        }

        let accepted = false;

        if (best){

            accepted =
                best.good >= MIN_GOOD_MATCHES &&
                best.inliers >= MIN_RANSAC_INLIERS &&
                best.ratio >= MIN_INLIER_RATIO &&
                margin >= MIN_RELATIVE_MARGIN;
        }

        /*
           Visible diagnostic.
        */

        if (best){

            setStatus(
                "Best: " +
                best.photo.id +
                " | ORB: " +
                best.good +
                " | RANSAC: " +
                best.inliers +
                " | Ratio: " +
                Math.round(best.ratio*100) +
                "% | Margin: " +
                Math.round(margin*100) +
                "%"
            );

            setDebug(
                "2nd: " +
                (second ? second.photo.id : "-") +
                " | Accepted: " +
                (accepted ? "YES" : "NO") +
                " | Confirm: " +
                candidateCount +
                "/" +
                REQUIRED_CONFIRMATIONS
            );

        }
        else{

            setStatus(
                "Scanning... Point camera at a photo."
            );
        }

        /*
           Two consecutive accepted frames.
        */

        if (accepted && best){

            if (
                candidateId ===
                best.photo.id
            ){
                candidateCount++;
            }
            else{
                candidateId =
                    best.photo.id;
                candidateCount = 1;
            }

        }
        else{

            candidateId = null;
            candidateCount = 0;
        }

        const now = Date.now();

        if (
            accepted &&
            best &&
            candidateCount >=
                REQUIRED_CONFIRMATIONS &&
            now - lastDetectionTime >
                DETECTION_COOLDOWN
        ){

            lastDetectionTime = now;

            recognizePhoto(
                best.photo
            );
        }

        frame.delete();
        gray.delete();
        keypoints.delete();
        descriptors.delete();

    }
    catch(error){

        console.error(
            "SCAN FRAME ERROR:",
            error
        );

        setStatus(
            "Scanner error: " +
            error.message
        );
    }

    if (
        scannerRunning &&
        !videoPlaying
    ){
        requestAnimationFrame(scanFrame);
    }
}

/* =========================================================
   15. RECOGNIZED
   ========================================================= */

function recognizePhoto(photo){

    setStatus(
        "FOUND " +
        photo.id +
        " — PLAYING VIDEO"
    );

    playVideo(photo.video);
}

/* =========================================================
   16. VIDEO
   ========================================================= */

async function playVideo(videoUrl){

    videoPlaying = true;
    scannerRunning = false;

    if (camera.srcObject){

        camera.srcObject
            .getTracks()
            .forEach(
                track => track.stop()
            );

        camera.srcObject = null;
    }

    videoContainer.style.display = "flex";
    soundPanel.style.display = "none";

    videoPlayer.src = videoUrl;
    videoPlayer.muted = false;
    videoPlayer.load();

    try{

        await videoPlayer.play();

    }
    catch(error){

        videoPlayer.muted = true;

        try{

            await videoPlayer.play();

            soundPanel.style.display = "block";

        }
        catch(secondError){

            console.error(
                "VIDEO PLAY ERROR:",
                secondError
            );

            setStatus(
                "Video could not be played."
            );
        }
    }

    videoPlayer.onended =
        function(){
            closeVideo();
        };
}

function enableSound(){

    videoPlayer.muted = false;
    soundPanel.style.display = "none";

    videoPlayer.play().catch(
        error => console.error(error)
    );
}

/* =========================================================
   17. CLOSE
   ========================================================= */

function closeVideo(){

    videoPlayer.pause();
    videoPlayer.removeAttribute("src");
    videoPlayer.load();

    videoContainer.style.display = "none";
    soundPanel.style.display = "none";

    videoPlaying = false;
    scannerRunning = false;

    candidateId = null;
    candidateCount = 0;

    startButton.disabled = false;
    startButton.innerText = "START SCANNER";

    setStatus(
        "Ready. Press START SCANNER."
    );
}

/* =========================================================
   18. PAGE LOAD
   ========================================================= */

window.addEventListener(
    "load",
    function(){

        camera =
            document.getElementById("camera");

        canvas =
            document.getElementById("canvas");

        context =
            canvas.getContext(
                "2d",
                {willReadFrequently:true}
            );

        statusText =
            document.getElementById("status");

        debugText =
            document.getElementById("debug");

        startButton =
            document.getElementById("startButton");

        videoContainer =
            document.getElementById("videoContainer");

        videoPlayer =
            document.getElementById("videoPlayer");

        soundPanel =
            document.getElementById("soundPanel");

        startButton.addEventListener(
            "click",
            startScanner
        );

        waitForOpenCV();
    }
);
</script>

</body>
</html>
