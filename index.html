<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Magic Photo Frame - Lord Venkateswara</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin:14px 0 8px;
    font-size:23px;
}

#camera{
    width:100%;
    max-width:700px;
    height:auto;
    display:block;
    margin:0 auto;
    background:#000;
}

#canvas{
    display:none;
}

#status{
    margin:10px 12px;
    min-height:42px;
    font-size:16px;
    line-height:1.35;
}

#startButton{
    padding:14px 24px;
    font-size:18px;
    border:0;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

#startButton:disabled{
    opacity:.5;
    cursor:not-allowed;
}

#videoContainer{
    display:none;
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
    z-index:100;
    align-items:center;
    justify-content:center;
}

#videoPlayer{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

#closeVideo{
    position:absolute;
    top:max(18px,env(safe-area-inset-top));
    right:18px;
    z-index:200;
    min-width:90px;
    height:55px;
    padding:0 18px;
    border:2px solid #fff;
    border-radius:12px;
    background:rgba(0,0,0,.80);
    color:#fff;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

#soundPanel{
    display:none;
    position:absolute;
    left:0;
    right:0;
    bottom:max(30px,env(safe-area-inset-bottom));
    z-index:201;
}

#playSoundButton{
    padding:14px 24px;
    font-size:18px;
    border:0;
    border-radius:9px;
    background:#fff;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>MAGIC PHOTO FRAME</h1>

<button id="startButton" disabled>
    LOADING OPENCV...
</button>

<video id="camera" autoplay playsinline muted></video>

<canvas id="canvas"></canvas>

<div id="status">
    Loading OpenCV...
</div>

<div id="videoContainer">

    <button id="closeVideo" onclick="closeVideo()">
        ✕ CLOSE
    </button>

    <video id="videoPlayer"
           controls
           playsinline
           preload="metadata">
    </video>

    <div id="soundPanel">
        <button id="playSoundButton" onclick="enableSound()">
            🔊 TAP FOR SOUND
        </button>
    </div>

</div>

<script>

/* =========================================================
   PROJECT SETTINGS
   ========================================================= */

const GITHUB_BASE =
    "https://vishwanathyerramsetty-oss.github.io/MagicPhotoFrame/";

const TOTAL_PHOTOS = 19;


/* =========================================================
   CREATE PHOTO / VIDEO LIST
   ========================================================= */

const photoVideos = Array.from(
    {length: TOTAL_PHOTOS},
    (_, i) => {
        const n = String(i + 1).padStart(3, "0");

        return {
            id: "PHOTO_" + n,
            image: "photos/PHOTO_" + n + ".jpg",
            video: GITHUB_BASE + "PHOTO_" + n + ".mp4"
        };
    }
);


/* =========================================================
   PAGE ELEMENTS
   ========================================================= */

let camera;
let canvas;
let context;
let statusText;
let startButton;
let videoContainer;
let videoPlayer;
let soundPanel;


/* =========================================================
   OPENCV / SCANNER STATE
   ========================================================= */

let referencePhotos = [];
let liveOrb = null;

let scannerRunning = false;
let videoPlaying = false;
let cvReady = false;

let lastScanTime = 0;
let lastDetectionTime = 0;

let candidateId = null;
let candidateCount = 0;


/* =========================================================
   RECOGNITION SETTINGS

   These are intentionally more forgiving than the previous
   version. We can make them stricter after the scanner works.
   ========================================================= */

const ORB_FEATURES = 1000;

const MATCH_RATIO = 0.75;

const MIN_GOOD_MATCHES = 8;

const MIN_RANSAC_INLIERS = 5;

const MIN_INLIER_RATIO = 0.20;

const MIN_RELATIVE_MARGIN = 0.08;

const REQUIRED_CONFIRMATIONS = 2;

const SCAN_INTERVAL = 250;

const DETECTION_COOLDOWN = 4000;


/* =========================================================
   OPENCV READY
   ========================================================= */

function onOpenCvReady(){

    cvReady = true;

    statusText.innerText =
        "OpenCV ready. Press START SCANNER.";

    startButton.disabled = false;

    startButton.innerText =
        "START SCANNER";
}


/* =========================================================
   WAIT FOR OPENCV

   Some phones load OpenCV differently, so we use both the
   runtime callback and a small safety check.
   ========================================================= */

function waitForOpenCV(){

    const timer = setInterval(function(){

        if(
            typeof cv !== "undefined" &&
            cv.Mat &&
            cv.ORB
        ){
            clearInterval(timer);

            if(!cvReady){
                onOpenCvReady();
            }
        }

    }, 250);

    setTimeout(function(){

        if(!cvReady){

            statusText.innerText =
                "OpenCV is taking too long to load. Check internet and refresh.";
        }

    }, 15000);
}


/* =========================================================
   CREATE RECOGNITION MASK

   Ignore only a small outer border. Do not remove too much
   of the actual Venkateswara image.
   ========================================================= */

function createRecognitionMask(width, height){

    const mask = new cv.Mat(
        height,
        width,
        cv.CV_8UC1,
        new cv.Scalar(0)
    );

    const x = Math.round(width * 0.04);
    const y = Math.round(height * 0.03);

    const w = Math.round(width * 0.92);
    const h = Math.round(height * 0.94);

    cv.rectangle(
        mask,
        new cv.Point(x, y),
        new cv.Point(x + w, y + h),
        new cv.Scalar(255),
        -1
    );

    return mask;
}


/* =========================================================
   LOAD ONE REFERENCE PHOTO
   ========================================================= */

async function loadReferencePhoto(photo){

    return new Promise(function(resolve, reject){

        const img = new Image();

        img.onload = function(){

            try{

                const targetWidth = 480;

                const scale =
                    targetWidth / img.naturalWidth;

                const refCanvas =
                    document.createElement("canvas");

                refCanvas.width = targetWidth;

                refCanvas.height =
                    Math.max(
                        1,
                        Math.round(
                            img.naturalHeight * scale
                        )
                    );

                const ctx =
                    refCanvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    refCanvas.width,
                    refCanvas.height
                );

                const mat =
                    cv.imread(refCanvas);

                const gray =
                    new cv.Mat();

                cv.cvtColor(
                    mat,
                    gray,
                    cv.COLOR_RGBA2GRAY
                );

                const mask =
                    createRecognitionMask(
                        gray.cols,
                        gray.rows
                    );

                const orb =
                    new cv.ORB(ORB_FEATURES);

                const keypoints =
                    new cv.KeyPointVector();

                const descriptors =
                    new cv.Mat();

                orb.detectAndCompute(
                    gray,
                    mask,
                    keypoints,
                    descriptors
                );

                const descriptorCount =
                    descriptors.empty()
                        ? 0
                        : descriptors.rows;

                console.log(
                    photo.id,
                    "reference keypoints:",
                    keypoints.size(),
                    "descriptors:",
                    descriptorCount
                );

                if(descriptors.empty()){

                    mat.delete();
                    gray.delete();
                    mask.delete();
                    orb.delete();
                    keypoints.delete();
                    descriptors.delete();

                    reject(
                        new Error(
                            photo.id +
                            " has no ORB descriptors."
                        )
                    );

                    return;
                }

                referencePhotos.push({

                    id: photo.id,

                    video: photo.video,

                    keypoints: keypoints,

                    descriptors: descriptors,

                    width: gray.cols,

                    height: gray.rows

                });

                mat.delete();
                gray.delete();
                mask.delete();
                orb.delete();

                resolve();

            }
            catch(error){

                reject(error);
            }
        };

        img.onerror = function(){

            reject(
                new Error(
                    "Cannot load " +
                    photo.image +
                    " from GitHub Pages."
                )
            );
        };

        /*
           Cache-busting query prevents an old JPG from being
           reused by the browser after you replace a photo.
        */
        img.src =
            photo.image +
            "?v=20261001";
    });
}


/* =========================================================
   LOAD ALL 19 REFERENCE PHOTOS
   ========================================================= */

async function loadReferencePhotos(){

    referencePhotos = [];

    for(
        let i = 0;
        i < photoVideos.length;
        i++
    ){

        const photo = photoVideos[i];

        statusText.innerText =
            "Loading " +
            photo.id +
            " (" +
            (i + 1) +
            "/19)...";

        await loadReferencePhoto(photo);
    }

    statusText.innerText =
        "All 19 photos loaded. Ready to scan.";

    console.log(
        "REFERENCE PHOTOS LOADED:",
        referencePhotos.length
    );
}


/* =========================================================
   START SCANNER
   ========================================================= */

async function startScanner(){

    if(scannerRunning || videoPlaying){
        return;
    }

    if(!cvReady){

        statusText.innerText =
            "OpenCV is not ready yet.";

        return;
    }

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        statusText.innerText =
            "Camera is not available in this browser.";

        return;
    }

    try{

        startButton.disabled = true;

        statusText.innerText =
            "Requesting camera permission...";

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }
                },

                audio: false

            });

        camera.srcObject = stream;

        await camera.play();

        candidateId = null;
        candidateCount = 0;

        if(referencePhotos.length === 0){

            await loadReferencePhotos();
        }

        if(!liveOrb){

            liveOrb =
                new cv.ORB(ORB_FEATURES);
        }

        scannerRunning = true;

        startButton.innerText =
            "SCANNING...";

        statusText.innerText =
            "Scanning 19 photos. Point camera at PHOTO_001...PHOTO_019.";

        lastScanTime = 0;

        requestAnimationFrame(scanFrame);

    }
    catch(error){

        console.error(
            "START SCANNER ERROR:",
            error
        );

        scannerRunning = false;

        startButton.disabled = false;

        startButton.innerText =
            "START SCANNER";

        if(error.name === "NotAllowedError"){

            statusText.innerText =
                "Camera permission denied. Allow camera access and try again.";

        }
        else if(error.name === "NotFoundError"){

            statusText.innerText =
                "No camera found on this phone.";

        }
        else{

            statusText.innerText =
                "Scanner error: " +
                error.message;
        }
    }
}


/* =========================================================
   COMPARE LIVE FRAME WITH ONE REFERENCE
   ========================================================= */

function compareReference(
    reference,
    liveKeypoints,
    liveDescriptors
){

    if(
        !reference ||
        reference.descriptors.empty() ||
        liveDescriptors.empty()
    ){

        return null;
    }

    const matcher =
        new cv.BFMatcher(
            cv.NORM_HAMMING,
            false
        );

    const matches =
        new cv.DMatchVectorVector();

    matcher.knnMatch(
        liveDescriptors,
        reference.descriptors,
        matches,
        2
    );

    const goodMatches = [];

    for(
        let i = 0;
        i < matches.size();
        i++
    ){

        const pair =
            matches.get(i);

        if(pair.size() >= 2){

            const first =
                pair.get(0);

            const second =
                pair.get(1);

            if(
                first.distance <
                MATCH_RATIO * second.distance
            ){

                goodMatches.push(first);
            }
        }
    }

    if(goodMatches.length < MIN_GOOD_MATCHES){

        matches.delete();
        matcher.delete();

        return {

            goodMatches: goodMatches.length,
            inliers: 0,
            inlierRatio: 0,
            score: 0

        };
    }

    const srcPoints = [];
    const dstPoints = [];

    for(
        const match of goodMatches
    ){

        const livePoint =
            liveKeypoints
                .get(match.queryIdx)
                .pt;

        const referencePoint =
            reference.keypoints
                .get(match.trainIdx)
                .pt;

        srcPoints.push(livePoint);
        dstPoints.push(referencePoint);
    }

    const srcMat =
        cv.matFromArray(
            srcPoints.length,
            2,
            cv.CV_32FC2,
            srcPoints.flatMap(
                p => [p.x, p.y]
            )
        );

    const dstMat =
        cv.matFromArray(
            dstPoints.length,
            2,
            cv.CV_32FC2,
            dstPoints.flatMap(
                p => [p.x, p.y]
            )
        );

    const inlierMask =
        new cv.Mat();

    let homography = null;

    try{

        homography =
            cv.findHomography(
                srcMat,
                dstMat,
                cv.RANSAC,
                7.0,
                inlierMask
            );

    }
    catch(error){

        console.warn(
            "Homography error:",
            error
        );
    }

    let inliers = 0;

    if(
        homography &&
        !homography.empty() &&
        !inlierMask.empty()
    ){

        for(
            let i = 0;
            i < inlierMask.rows;
            i++
        ){

            if(
                inlierMask.ucharPtr(i,0)[0] !== 0
            ){

                inliers++;
            }
        }
    }

    const inlierRatio =
        goodMatches.length > 0
            ? inliers / goodMatches.length
            : 0;

    /*
       Geometry gets more weight than raw ORB count.
    */

    const score =
        (inliers * 2.0) +
        (goodMatches.length * 0.5) +
        (inlierRatio * 20.0);

    if(homography){
        homography.delete();
    }

    inlierMask.delete();
    srcMat.delete();
    dstMat.delete();
    matches.delete();
    matcher.delete();

    return {

        goodMatches: goodMatches.length,

        inliers: inliers,

        inlierRatio: inlierRatio,

        score: score

    };
}


/* =========================================================
   SCAN ONE CAMERA FRAME
   ========================================================= */

function scanFrame(timestamp){

    if(
        !scannerRunning ||
        videoPlaying
    ){

        return;
    }

    if(
        timestamp - lastScanTime <
        SCAN_INTERVAL
    ){

        requestAnimationFrame(scanFrame);

        return;
    }

    lastScanTime = timestamp;

    try{

        const width =
            camera.videoWidth;

        const height =
            camera.videoHeight;

        if(!width || !height){

            requestAnimationFrame(scanFrame);

            return;
        }

        const scanWidth = 480;

        canvas.width = scanWidth;

        canvas.height =
            Math.round(
                height *
                (scanWidth / width)
            );

        context.drawImage(
            camera,
            0,
            0,
            canvas.width,
            canvas.height
        );

        const frame =
            cv.imread(canvas);

        const gray =
            new cv.Mat();

        cv.cvtColor(
            frame,
            gray,
            cv.COLOR_RGBA2GRAY
        );

        const liveMask =
            createRecognitionMask(
                gray.cols,
                gray.rows
            );

        const keypoints =
            new cv.KeyPointVector();

        const descriptors =
            new cv.Mat();

        liveOrb.detectAndCompute(
            gray,
            liveMask,
            keypoints,
            descriptors
        );

        let results = [];

        if(!descriptors.empty()){

            for(
                const reference of referencePhotos
            ){

                const result =
                    compareReference(
                        reference,
                        keypoints,
                        descriptors
                    );

                if(result){

                    results.push({

                        photo: reference,

                        goodMatches:
                            result.goodMatches,

                        inliers:
                            result.inliers,

                        inlierRatio:
                            result.inlierRatio,

                        score:
                            result.score

                    });
                }
            }
        }

        results.sort(
            (a,b) =>
                b.score - a.score
        );

        const best =
            results.length > 0
                ? results[0]
                : null;

        const second =
            results.length > 1
                ? results[1]
                : null;

        let relativeMargin = 0;

        if(best){

            if(second && best.score > 0){

                relativeMargin =
                    (
                        best.score -
                        second.score
                    ) /
                    best.score;

            }
            else{

                relativeMargin = 1;
            }
        }

        /*
           A candidate is accepted only when:
           - enough ORB matches
           - enough RANSAC inliers
           - reasonable geometry
           - best result is separated from second result
        */

        let accepted = false;

        if(best){

            accepted =
                best.goodMatches >= MIN_GOOD_MATCHES &&
                best.inliers >= MIN_RANSAC_INLIERS &&
                best.inlierRatio >= MIN_INLIER_RATIO &&
                relativeMargin >= MIN_RELATIVE_MARGIN;
        }


        /* =====================================================
           DEBUG STATUS

           This is deliberately visible so we can tune the
           scanner using real camera values.
           ===================================================== */

        if(best){

            statusText.innerText =
                "Best: " +
                best.photo.id +
                " | ORB: " +
                best.goodMatches +
                " | RANSAC: " +
                best.inliers +
                " | Ratio: " +
                Math.round(
                    best.inlierRatio * 100
                ) +
                "% | Margin: " +
                Math.round(
                    relativeMargin * 100
                ) +
                "%";

        }
        else{

            statusText.innerText =
                "Scanning... Point camera at a photo.";
        }


        /* =====================================================
           TEMPORAL CONFIRMATION
           ===================================================== */

        if(accepted && best){

            if(candidateId === best.photo.id){

                candidateCount++;

            }
            else{

                candidateId =
                    best.photo.id;

                candidateCount = 1;
            }

            statusText.innerText +=
                " | Confirm: " +
                candidateCount +
                "/" +
                REQUIRED_CONFIRMATIONS;

        }
        else{

            candidateId = null;
            candidateCount = 0;
        }


        /* =====================================================
           PLAY VIDEO
           ===================================================== */

        const now = Date.now();

        if(
            accepted &&
            best &&
            candidateCount >=
                REQUIRED_CONFIRMATIONS &&
            now - lastDetectionTime >
                DETECTION_COOLDOWN
        ){

            lastDetectionTime = now;

            recognizePhoto(
                best.photo,
                best.goodMatches,
                best.inliers,
                best.inlierRatio
            );
        }


        frame.delete();
        gray.delete();
        liveMask.delete();
        keypoints.delete();
        descriptors.delete();

    }
    catch(error){

        console.error(
            "SCAN ERROR:",
            error
        );

        statusText.innerText =
            "Scanner error. Retrying...";
    }

    if(
        scannerRunning &&
        !videoPlaying
    ){

        requestAnimationFrame(scanFrame);
    }
}


/* =========================================================
   PHOTO RECOGNIZED
   ========================================================= */

function recognizePhoto(
    photo,
    goodMatches,
    inliers,
    inlierRatio
){

    console.log(
        "PHOTO RECOGNIZED:",
        photo.id,
        "ORB:",
        goodMatches,
        "RANSAC:",
        inliers,
        "Ratio:",
        inlierRatio
    );

    statusText.innerText =
        "FOUND " +
        photo.id +
        " — PLAYING VIDEO";

    playVideo(photo.video);
}


/* =========================================================
   PLAY VIDEO
   ========================================================= */

async function playVideo(videoUrl){

    videoPlaying = true;
    scannerRunning = false;

    if(camera.srcObject){

        camera.srcObject
            .getTracks()
            .forEach(
                track => track.stop()
            );

        camera.srcObject = null;
    }

    videoContainer.style.display = "flex";

    soundPanel.style.display = "none";

    videoPlayer.src = videoUrl;

    videoPlayer.muted = false;

    videoPlayer.load();

    try{

        await videoPlayer.play();

    }
    catch(error){

        console.log(
            "Autoplay with sound blocked."
        );

        videoPlayer.muted = true;

        try{

            await videoPlayer.play();

            soundPanel.style.display =
                "block";

        }
        catch(secondError){

            console.error(
                "VIDEO PLAY ERROR:",
                secondError
            );

            statusText.innerText =
                "Unable to play this video.";
        }
    }

    videoPlayer.onended =
        function(){

            closeVideo();
        };
}


/* =========================================================
   ENABLE SOUND
   ========================================================= */

function enableSound(){

    videoPlayer.muted = false;

    soundPanel.style.display = "none";

    videoPlayer
        .play()
        .catch(
            error => {
                console.error(
                    "Sound enable error:",
                    error
                );
            }
        );
}


/* =========================================================
   CLOSE VIDEO
   ========================================================= */

function closeVideo(){

    console.log(
        "CLOSE BUTTON PRESSED"
    );

    videoPlayer.pause();

    videoPlayer.removeAttribute("src");

    videoPlayer.load();

    videoContainer.style.display = "none";

    soundPanel.style.display = "none";

    videoPlaying = false;

    scannerRunning = false;

    candidateId = null;
    candidateCount = 0;

    lastDetectionTime = Date.now();

    startButton.disabled = false;

    startButton.innerText =
        "START SCANNER";

    statusText.innerText =
        "Ready. Press START SCANNER.";

}


/* =========================================================
   PAGE LOAD
   ========================================================= */

window.addEventListener(
    "load",
    function(){

        camera =
            document.getElementById(
                "camera"
            );

        canvas =
            document.getElementById(
                "canvas"
            );

        context =
            canvas.getContext("2d");

        statusText =
            document.getElementById(
                "status"
            );

        startButton =
            document.getElementById(
                "startButton"
            );

        videoContainer =
            document.getElementById(
                "videoContainer"
            );

        videoPlayer =
            document.getElementById(
                "videoPlayer"
            );

        soundPanel =
            document.getElementById(
                "soundPanel"
            );

        startButton.addEventListener(
            "click",
            startScanner
        );

        waitForOpenCV();

    }
);

</script>

</body>
</html>
