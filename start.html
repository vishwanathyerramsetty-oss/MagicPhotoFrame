<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>MAGIC PHOTO FRAME – Lord Venkateswara</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(
                135deg,
                #fff8e7,
                #f5dfb3
            );

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            overflow: hidden;
        }

        .container {
            width: 92%;
            max-width: 600px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 25px;

            padding: 35px 25px 40px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.20);
        }

        .om {
            font-size: 65px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 28px;
            color: #7a3f00;
            margin-bottom: 12px;
            line-height: 1.25;
        }

        h2 {
            font-size: 21px;
            color: #a05a00;
            margin-bottom: 25px;
        }

        .message {
            font-size: 17px;
            line-height: 1.6;
            color: #444;

            margin-bottom: 30px;
        }

        .button {
            display: inline-block;

            width: 90%;
            max-width: 420px;

            padding: 18px 25px;

            background: #8b4513;
            color: white;

            text-decoration: none;

            font-size: 20px;
            font-weight: bold;

            border-radius: 12px;

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.25);

            transition: transform 0.15s,
                        background 0.15s;
        }

        .button:hover {
            background: #6f350f;
            transform: scale(1.03);
        }

        .button:active {
            transform: scale(0.97);
        }

        .instruction {
            margin-top: 25px;

            font-size: 15px;
            color: #666;

            line-height: 1.5;
        }

        .footer {
            margin-top: 25px;

            font-size: 13px;
            color: #888;
        }

        @media (max-width: 480px) {

            .container {
                padding: 28px 18px 30px;
                border-radius: 20px;
            }

            .om {
                font-size: 50px;
            }

            h1 {
                font-size: 23px;
            }

            h2 {
                font-size: 18px;
            }

            .message {
                font-size: 15px;
            }

            .button {
                font-size: 18px;
                padding: 17px 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="om">🕉️</div>

        <h1>
            MAGIC PHOTO FRAME
        </h1>

        <h2>
            Lord Venkateswara
        </h2>

        <div class="message">
            Scan the special photo using your mobile camera
            and experience the magic.
        </div>

        <!-- IMPORTANT:
             This explicitly opens index.html -->
        <a
            class="button"
            href="index.html">
            OPEN MAGIC SCANNER
        </a>

        <div class="instruction">
            📱 Tap the button above<br>
            📷 Allow camera permission when asked<br>
            🖼️ Point the camera at the Magic Photo
        </div>

        <div class="footer">
            Magic Photo Frame © 2026
        </div>

    </div>

</body>
</html>
