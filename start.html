<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b5e34">
<title>Magic Photo Frame | Lord Venkateswara</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #fff8e8, #f3d7a1);
    color: #3d2414;
}

.card {
    width: min(94vw, 540px);
    background: rgba(255,255,255,0.97);
    border-radius: 26px;
    padding: 34px 24px 30px;
    text-align: center;
    box-shadow: 0 14px 40px rgba(0,0,0,0.18);
}

.icon {
    font-size: 58px;
    margin-bottom: 6px;
}

h1 {
    margin: 0;
    font-size: clamp(28px, 7vw, 38px);
    letter-spacing: 1px;
}

h2 {
    margin: 10px 0 22px;
    font-size: clamp(21px, 5vw, 27px);
    font-weight: 600;
}

.subtitle {
    font-size: 17px;
    line-height: 1.6;
    margin: 0 auto 24px;
    max-width: 420px;
}

.steps {
    text-align: left;
    margin: 0 auto 26px;
    max-width: 390px;
    font-size: 17px;
    line-height: 1.8;
}

.button {
    display: block;
    width: 100%;
    text-decoration: none;
    background: #8b5e34;
    color: white;
    padding: 17px 20px;
    border-radius: 15px;
    font-size: 20px;
    font-weight: 700;
    box-shadow: 0 5px 14px rgba(0,0,0,0.16);
}

.button:active {
    transform: scale(0.98);
}

.note {
    margin-top: 20px;
    font-size: 13px;
    line-height: 1.5;
    color: #6d5a49;
}
</style>
</head>

<body>
<main class="card">

    <div class="icon">🙏</div>

    <h1>MAGIC PHOTO FRAME</h1>

    <h2>Lord Venkateswara</h2>

    <p class="subtitle">
        Bring your sacred photo to life with an interactive video experience.
    </p>

    <div class="steps">
        📱 <strong>Step 1:</strong> Open the Magic Scanner<br>
        📷 <strong>Step 2:</strong> Point your camera at the photo<br>
        🎬 <strong>Step 3:</strong> Watch the video come alive
    </div>

    <a class="button" href="./">
        OPEN MAGIC SCANNER
    </a>

    <div class="note">
        Internet connection is required for video playback.
    </div>

</main>
</body>
</html>
